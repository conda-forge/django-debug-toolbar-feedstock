schema_version: 1

context:
  version: "8.0.0"

package:
  name: django-debug-toolbar
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-debug-toolbar/django_debug_toolbar-${{ version }}.tar.gz
  sha256: cae32d3e441e608f39f3f1ca6b3f028c38d5d04d74c98d8ab96d46022dee3163

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - django >=5.2
    - sqlparse >=0.2

tests:
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A configurable set of panels that display various debug information about the current request/response.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/django-commons/django-debug-toolbar
  repository: https://github.com/django-commons/django-debug-toolbar
  documentation: https://django-debug-toolbar.readthedocs.io/

extra:
  recipe-maintainers:
    - ocefpaf
